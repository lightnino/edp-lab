name: CI
on: [push, pull_request]
jobs:
  deterministic-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
