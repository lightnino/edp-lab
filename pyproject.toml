[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edp-lab"
version = "0.1.0"
description = "Deterministic EDP source integration learning lab"
requires-python = ">=3.12,<3.13"
dependencies = ["duckdb>=1.4,<3"]

[project.scripts]
edp-day6-v3 = "edp_lab.vault.v3_spark_runtime:main"

[project.optional-dependencies]
agents = ["openai>=2", "openai-agents>=0.2"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/edp_lab"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# The owner-installed host is byte-pinned; import reordering invalidates its SHA.
"src/edp_lab/ingestion/n750_step8_authorization.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
